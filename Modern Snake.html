<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            /* Slate 900 */
            font-family: 'Orbitron', sans-serif;
            touch-action: none;
        }

        canvas {
            display: block;
            margin: auto;
            box-shadow: 0 0 50px rgba(34, 197, 94, 0.1);
            /* Green glow */
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .interactive {
            pointer-events: auto;
        }

        /* 네온 텍스트 효과 */
        .neon-text {
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #22c55e, 0 0 30px #22c55e, 0 0 40px #22c55e;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }

        .hidden {
            display: none !important;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            user-select: none;
            touch-action: manipulation;
            transition: background 0.1s;
        }

        .control-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }

        #mobileControls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            /* JS로 모바일에서만 표시 */
            grid-template-areas:
                ". up ."
                "left down right";
            gap: 10px;
            pointer-events: auto;
        }
    </style>
</head>

<body>

    <!-- 게임 캔버스 -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI 오버레이 -->
    <div id="uiLayer" class="ui-layer">

        <!-- HUD -->
        <div class="absolute top-4 left-4 right-4 flex justify-between items-start text-white select-none">
            <div class="glass-panel p-4 flex flex-col gap-1 w-32">
                <div class="text-sm text-gray-400">SCORE</div>
                <div id="scoreDisplay" class="text-2xl text-green-400">0</div>
            </div>

            <div class="glass-panel p-4 flex flex-col items-end gap-1 w-32">
                <div class="text-sm text-gray-400">BEST</div>
                <div id="bestScoreDisplay" class="text-2xl text-yellow-400">0</div>
            </div>
        </div>

        <!-- 시작 화면 -->
        <div id="startScreen"
            class="glass-panel p-10 text-center interactive flex flex-col items-center gap-6 animate-pulse z-10">
            <h1 class="text-5xl text-white font-bold neon-text mb-4">NEON SNAKE</h1>
            <p class="text-gray-300 mb-4">에너지를 획득하여 성장하세요</p>
            <p class="text-sm text-green-400 mb-2">화살표 키로 이동</p>
            <button id="startBtn"
                class="px-8 py-3 bg-green-600 hover:bg-green-500 text-white font-bold rounded-full transition-all shadow-[0_0_15px_rgba(34,197,94,0.5)] hover:shadow-[0_0_25px_rgba(34,197,94,0.8)] transform hover:scale-105">
                GAME START
            </button>
        </div>

        <!-- 게임 오버 화면 -->
        <div id="gameOverScreen"
            class="glass-panel p-10 text-center interactive hidden flex flex-col items-center gap-6 z-10">
            <h1 class="text-5xl text-red-500 font-bold mb-2" style="text-shadow: 0 0 20px red;">SYSTEM FAILURE</h1>
            <p class="text-white text-2xl">FINAL SCORE: <span id="finalScore">0</span></p>
            <button id="restartBtn"
                class="px-8 py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-full transition-all shadow-[0_0_15px_rgba(8,145,178,0.5)] mt-4">
                REBOOT SYSTEM
            </button>
        </div>

        <!-- 모바일 컨트롤 -->
        <div id="mobileControls">
            <div id="btnUp" class="control-btn" style="grid-area: up;">↑</div>
            <div id="btnLeft" class="control-btn" style="grid-area: left;">←</div>
            <div id="btnDown" class="control-btn" style="grid-area: down;">↓</div>
            <div id="btnRight" class="control-btn" style="grid-area: right;">→</div>
        </div>
    </div>

    <script>
        // --- 오디오 시스템 ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'turn') {
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(200, now);
                oscillator.frequency.linearRampToValueAtTime(100, now + 0.05);
                gainNode.gain.setValueAtTime(0.05, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.05);
                oscillator.start(now);
                oscillator.stop(now + 0.05);
            } else if (type === 'eat') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(400, now);
                oscillator.frequency.exponentialRampToValueAtTime(800, now + 0.1);

                const osc2 = audioCtx.createOscillator();
                osc2.type = 'square';
                osc2.frequency.setValueAtTime(600, now);
                osc2.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                osc2.connect(gainNode);
                osc2.start(now);
                osc2.stop(now + 0.1);

                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                oscillator.start(now);
                oscillator.stop(now + 0.15);
            } else if (type === 'crash') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(200, now);
                oscillator.frequency.exponentialRampToValueAtTime(50, now + 0.5);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                oscillator.start(now);
                oscillator.stop(now + 0.5);
            }
        }

        // --- 게임 설정 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRID_SIZE = 25;
        let TILE_COUNT_X = 20;
        let TILE_COUNT_Y = 20;

        let gameState = 'MENU';
        let score = 0;
        let bestScore = localStorage.getItem('snake_best') || 0;
        document.getElementById('bestScoreDisplay').innerText = bestScore;

        let snake = [];
        let velocity = { x: 0, y: 0 };
        let food = { x: 0, y: 0 };
        let inputQueue = [];

        let lastTime = 0;
        let moveTimer = 0;
        let moveInterval = 100; // ms per tick (Speed)

        let shake = 0; // Screen Shake intensity

        // --- 로직 ---

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // 그리드 재계산 (화면 꽉 채우기)
            TILE_COUNT_X = Math.floor(canvas.width / GRID_SIZE);
            TILE_COUNT_Y = Math.floor(canvas.height / GRID_SIZE);

            // 모바일 확인
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                document.getElementById('mobileControls').style.display = 'grid';
            }
        }

        function initGame() {
            const startX = Math.floor(TILE_COUNT_X / 2);
            const startY = Math.floor(TILE_COUNT_Y / 2);
            snake = [
                { x: startX, y: startY },
                { x: startX, y: startY + 1 },
                { x: startX, y: startY + 2 }
            ];
            velocity = { x: 0, y: -1 };
            inputQueue = [];
            score = 0;
            moveInterval = 100;
            spawnFood();
            updateUI();
        }

        function spawnFood() {
            // 뱀 몸통 피해서 생성
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * (TILE_COUNT_X - 2)) + 1;
                food.y = Math.floor(Math.random() * (TILE_COUNT_Y - 2)) + 1;

                valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }
        }

        function gameLoop(time) {
            const dt = time - lastTime;
            lastTime = time;

            if (gameState === 'PLAYING') {
                moveTimer += dt;
                if (moveTimer > moveInterval) {
                    tick();
                    moveTimer = 0;
                }
            }

            // Shake decay
            if (shake > 0) shake *= 0.9;
            if (shake < 0.5) shake = 0;

            draw();
            requestAnimationFrame(gameLoop);
        }

        function tick() {
            // Process Input
            if (inputQueue.length > 0) {
                const nextDir = inputQueue.shift();
                // 뒤로 돌기 금지 확인
                if (nextDir.x !== -velocity.x && nextDir.y !== -velocity.y) {
                    velocity = nextDir;
                    playSound('turn');
                }
            }

            const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

            // 충돌 확인 (벽)
            if (head.x < 0 || head.x >= TILE_COUNT_X || head.y < 0 || head.y >= TILE_COUNT_Y) {
                gameOver();
                return;
            }

            // 충돌 확인 (자기 자신)
            // 꼬리는 움직이면 비어지므로 꼬리 제외 체크 (단, 먹었을 땐 꼬리가 유지되므로 주의)
            // 간단히: 그냥 다 체크하고 꼬리 잘라내는 로직 후에 해도 되지만..
            // 보통 머리가 몸통에 닿으면 죽음.
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // 먹기 확인
            if (head.x === food.x && head.y === food.y) {
                score += 100;
                moveInterval = Math.max(50, moveInterval * 0.98); // Speed up
                snake.push(); // 꼬리 안 자름 = 길이 증가
                spawnFood();
                playSound('eat');
                createExplosion(head.x * GRID_SIZE, head.y * GRID_SIZE, '#f472b6', 10);
                shake = 5;
                updateUI();
            } else {
                snake.pop(); // 꼬리 자름
            }
        }

        function gameOver() {
            setGameState('GAMEOVER');
            playSound('crash');
            shake = 20;
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('snake_best', bestScore);
            }
            updateUI();
        }

        // --- 그리기 ---

        function draw() {
            // 배경
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();

            // Screen Shake
            if (shake > 0) {
                const rx = (Math.random() - 0.5) * shake;
                const ry = (Math.random() - 0.5) * shake;
                ctx.translate(rx, ry);
            }

            // 그리드 라인 (은은하게)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
                ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
            }
            for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
                ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();

            // Food
            const fx = food.x * GRID_SIZE + GRID_SIZE / 2;
            const fy = food.y * GRID_SIZE + GRID_SIZE / 2;
            const pulse = 1 + Math.sin(Date.now() / 200) * 0.2;

            ctx.shadowBlur = 20;
            ctx.shadowColor = '#f472b6';
            ctx.fillStyle = '#f472b6';

            ctx.beginPath();
            ctx.arc(fx, fy, (GRID_SIZE / 2 - 2) * pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Snake
            snake.forEach((seg, index) => {
                const sx = seg.x * GRID_SIZE;
                const sy = seg.y * GRID_SIZE;

                if (index === 0) { // Head
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#22c55e';
                    ctx.fillStyle = '#4ade80'; // Lighter Green
                } else {
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = '#15803d';
                    ctx.fillStyle = '#22c55e'; // Green
                }

                // 약간 작게 그려서 격자 느낌
                ctx.fillRect(sx + 1, sy + 1, GRID_SIZE - 2, GRID_SIZE - 2);
            });
            ctx.shadowBlur = 0;

            drawParticles();

            ctx.restore();
        }

        // --- 파티클 ---
        let particles = [];
        function createExplosion(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x + GRID_SIZE / 2,
                    y: y + GRID_SIZE / 2,
                    dx: (Math.random() - 0.5) * 10,
                    dy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }
        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.life -= 0.05;
                if (p.life <= 0) particles.splice(i, 1);
                else {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        // --- 시스템 ---

        function setGameState(newState) {
            gameState = newState;
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');

            if (newState === 'MENU') {
                document.getElementById('startScreen').classList.remove('hidden');
                document.getElementById('uiLayer').style.pointerEvents = 'auto'; // 버튼 클릭 허용
            } else if (newState === 'PLAYING') {
                initGame();
                document.getElementById('uiLayer').style.pointerEvents = 'none';
                if (window.innerWidth < 768) {
                    document.getElementById('uiLayer').style.pointerEvents = 'auto'; // For mobile controls
                }
            } else if (newState === 'GAMEOVER') {
                document.getElementById('gameOverScreen').classList.remove('hidden');
                document.getElementById('uiLayer').style.pointerEvents = 'auto';
            }
        }

        function updateUI() {
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('finalScore').innerText = score;
            document.getElementById('bestScoreDisplay').innerText = bestScore;
        }

        function handleInput(dir) {
            // 큐가 너무 쌓이지 않게 (반응성)
            if (inputQueue.length < 2) {
                inputQueue.push(dir);
            }
        }

        // --- 이벤트 리스너 ---
        window.addEventListener('resize', resizeCanvas);

        document.addEventListener('keydown', e => {
            if (gameState !== 'PLAYING') return;
            switch (e.key) {
                case 'ArrowUp': handleInput({ x: 0, y: -1 }); break;
                case 'ArrowDown': handleInput({ x: 0, y: 1 }); break;
                case 'ArrowLeft': handleInput({ x: -1, y: 0 }); break;
                case 'ArrowRight': handleInput({ x: 1, y: 0 }); break;
            }
        });

        // 모바일 버튼
        document.getElementById('btnUp').addEventListener('touchstart', (e) => { e.preventDefault(); handleInput({ x: 0, y: -1 }); });
        document.getElementById('btnDown').addEventListener('touchstart', (e) => { e.preventDefault(); handleInput({ x: 0, y: 1 }); });
        document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); handleInput({ x: -1, y: 0 }); });
        document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); handleInput({ x: 1, y: 0 }); });

        // 클릭 (PC 테스트용)
        document.getElementById('btnUp').addEventListener('mousedown', () => handleInput({ x: 0, y: -1 }));
        document.getElementById('btnDown').addEventListener('mousedown', () => handleInput({ x: 0, y: 1 }));
        document.getElementById('btnLeft').addEventListener('mousedown', () => handleInput({ x: -1, y: 0 }));
        document.getElementById('btnRight').addEventListener('mousedown', () => handleInput({ x: 1, y: 0 }));

        document.getElementById('startBtn').addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            setGameState('PLAYING');
        });
        document.getElementById('restartBtn').addEventListener('click', () => {
            setGameState('MENU');
            setTimeout(() => setGameState('PLAYING'), 100);
        });

        // Init
        resizeCanvas();
        requestAnimationFrame(gameLoop);

    </script>
</body>

</html>
