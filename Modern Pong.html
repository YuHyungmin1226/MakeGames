<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Pong</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            /* Slate 900 */
            font-family: 'Orbitron', sans-serif;
            touch-action: none;
        }

        canvas {
            display: block;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.1);
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .interactive {
            pointer-events: auto;
        }

        /* 네온 텍스트 효과 */
        .neon-text {
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #0ff, 0 0 30px #0ff, 0 0 40px #0ff;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- 게임 캔버스 -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI 오버레이 -->
    <div id="uiLayer" class="ui-layer">

        <!-- 점수 패널 -->
        <div
            class="absolute top-0 bottom-0 left-4 flex flex-col justify-center items-center text-white text-xl tracking-wider select-none gap-20 pointer-events-none opacity-50">
            <div class="rotate-90 origin-center text-red-500 whitespace-nowrap">CPU</div>
            <div class="rotate-90 origin-center text-cyan-400 whitespace-nowrap">YOU</div>
        </div>

        <div class="absolute top-4 left-0 right-0 flex justify-center gap-10 text-white text-4xl font-bold select-none">
            <div id="cpuScoreDisplay" class="text-red-500">0</div>
            <div class="text-gray-600">-</div>
            <div id="playerScoreDisplay" class="text-cyan-400">0</div>
        </div>

        <!-- 중앙 라인 (Visual Only via DOM or Canvas, let's do Canvas) -->

        <!-- 시작 화면 -->
        <div id="startScreen"
            class="glass-panel p-10 text-center interactive flex flex-col items-center gap-6 animate-pulse">
            <h1 class="text-5xl text-white font-bold neon-text mb-4">NEON PONG</h1>
            <p class="text-gray-300 mb-4">7점 내기 승부</p>
            <p class="text-sm text-cyan-400 mb-2">당신은 아래쪽 패들입니다</p>
            <button id="startBtn"
                class="px-8 py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-full transition-all shadow-[0_0_15px_rgba(8,145,178,0.5)] hover:shadow-[0_0_25px_rgba(8,145,178,0.8)] transform hover:scale-105">
                GAME START
            </button>
        </div>

        <!-- 게임 오버 화면 -->
        <div id="resultScreen" class="glass-panel p-10 text-center interactive hidden flex flex-col items-center gap-6">
            <h1 id="resultTitle" class="text-5xl font-bold mb-2 neon-text">VICTORY!</h1>
            <p id="resultMessage" class="text-gray-300">CPU를 이겼습니다!</p>
            <button id="restartBtn"
                class="px-8 py-3 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-full transition-all shadow-[0_0_15px_rgba(219,39,119,0.5)] mt-4">
                PLAY AGAIN
            </button>
        </div>
    </div>

    <script>
        // --- 오디오 시스템 (재사용) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'paddle') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'wall') {
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'score') {
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.2);
            }
        }

        // --- 게임 상수 및 설정 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const PADDLE_HEIGHT = 15;
        const PADDLE_WIDTH = 100;
        const BALL_RADIUS = 8;
        const WIN_SCORE = 7;

        let animationId;
        let lastTime = 0;

        let gameState = 'MENU'; // MENU, PLAYING, RESULT
        let playerScore = 0;
        let cpuScore = 0;
        let mouseX = 0;

        // --- 객체 정의 ---

        // 플레이어 패들 (아래)
        const playerPaddle = {
            x: 0,
            y: 0,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            color: '#00ffff', // Cyan
            targetX: 0,

            update(dt) {
                this.targetX = Math.min(Math.max(mouseX - this.width / 2, 0), canvas.width - this.width);
                this.x += (this.targetX - this.x) * 0.2;
            },

            draw() {
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.height, 8);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        };

        // CPU 패들 (위)
        const cpuPaddle = {
            x: 0,
            y: 20, // 상단 고정
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            color: '#ef4444', // Red
            speed: 300, // 픽셀/초

            update(dt) {
                // 공을 따라가는 간단한 AI
                let targetX = ball.x - this.width / 2;

                // 실수 유발 (공이 빠르게 올 때 반응 속도 제한)
                if (Math.abs(targetX - this.x) > 10) {
                    if (this.x < targetX) this.x += this.speed * dt;
                    else this.x -= this.speed * dt;
                }

                // 벽 제한
                this.x = Math.max(0, Math.min(canvas.width - this.width, this.x));
            },

            draw() {
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.height, 8);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        };

        // 공
        const ball = {
            x: 0,
            y: 0,
            dx: 0,
            dy: 0,
            baseSpeed: 500,
            speed: 500,
            color: '#ffffff',
            active: false,
            trail: [],

            reset(winner) {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.dx = 0;
                this.dy = 0;
                this.active = false;
                this.trail = [];
                this.speed = this.baseSpeed;

                // 1초 후 서브
                setTimeout(() => {
                    if (gameState === 'PLAYING') {
                        this.active = true;
                        // 승자에게 공을 주는 대신 랜덤 또는 진 사람에게? 
                        // Pong 룰: 보통 득점한 사람이 서브하거나 랜덤.
                        // 랜덤 방향 발사
                        this.dy = (Math.random() > 0.5 ? 1 : -1) * this.speed;
                        this.dx = (Math.random() * 0.4 - 0.2) * this.speed;
                    }
                }, 1000);
            },

            update(dt) {
                if (!this.active) return;

                // 꼬리 효과
                this.trail.push({ x: this.x, y: this.y, alpha: 1.0 });
                if (this.trail.length > 20) this.trail.shift();
                this.trail.forEach(t => t.alpha -= 0.05);

                let nextX = this.x + this.dx * dt;
                let nextY = this.y + this.dy * dt;

                // 좌우 벽 충돌
                if (nextX + BALL_RADIUS > canvas.width || nextX - BALL_RADIUS < 0) {
                    this.dx = -this.dx;
                    nextX = Math.max(BALL_RADIUS, Math.min(nextX, canvas.width - BALL_RADIUS));
                    playSound('wall');
                    createExplosion(nextX, nextY, '#fff', 5);
                }

                // 플레이어 패들 충돌 (아래)
                if (this.dy > 0 &&
                    nextY + BALL_RADIUS > playerPaddle.y &&
                    nextY - BALL_RADIUS < playerPaddle.y + playerPaddle.height &&
                    nextX > playerPaddle.x &&
                    nextX < playerPaddle.x + playerPaddle.width) {

                    this.dy = -this.speed;
                    this.speed += 20; // 속도 증가

                    // 각도 조절
                    let hitPoint = nextX - (playerPaddle.x + playerPaddle.width / 2);
                    this.dx = hitPoint * 5;

                    playSound('paddle');
                    createExplosion(this.x, this.y, '#00ffff', 10);
                }

                // CPU 패들 충돌 (위)
                if (this.dy < 0 &&
                    nextY - BALL_RADIUS < cpuPaddle.y + cpuPaddle.height &&
                    nextY + BALL_RADIUS > cpuPaddle.y &&
                    nextX > cpuPaddle.x &&
                    nextX < cpuPaddle.x + cpuPaddle.width) {

                    this.dy = this.speed;
                    this.speed += 20;

                    let hitPoint = nextX - (cpuPaddle.x + cpuPaddle.width / 2);
                    this.dx = hitPoint * 5;

                    playSound('paddle');
                    createExplosion(this.x, this.y, '#ef4444', 10);
                }

                // 득점 확인
                if (nextY > canvas.height) {
                    // CPU 득점
                    cpuScore++;
                    handleScore('CPU');
                } else if (nextY < 0) {
                    // 플레이어 득점
                    playerScore++;
                    handleScore('PLAYER');
                } else {
                    this.x += this.dx * dt;
                    this.y += this.dy * dt;
                }
            },

            draw() {
                this.trail.forEach(t => {
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, BALL_RADIUS * 0.8, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, t.alpha * 0.3)})`;
                    ctx.fill();
                });

                ctx.shadowBlur = 10;
                ctx.shadowColor = '#fff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, BALL_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        };

        // 파티클 시스템
        let particles = [];
        function createExplosion(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    dx: (Math.random() - 0.5) * 400,
                    dy: (Math.random() - 0.5) * 400,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function updateAndDrawParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx * dt;
                p.y += p.dy * dt;
                p.life -= dt * 2;
                if (p.life <= 0) particles.splice(i, 1);
                else {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        // --- 시스템 함수 ---

        function handleScore(scorer) {
            playSound('score');
            createExplosion(ball.x, ball.y, scorer === 'PLAYER' ? '#00ffff' : '#ef4444', 30);
            updateUI();

            if (playerScore >= WIN_SCORE || cpuScore >= WIN_SCORE) {
                endGame(scorer === 'PLAYER');
            } else {
                ball.reset();
            }
        }

        function endGame(playerWon) {
            gameState = 'RESULT';
            const title = document.getElementById('resultTitle');
            const msg = document.getElementById('resultMessage');

            if (playerWon) {
                title.innerText = "VICTORY!";
                title.className = "text-5xl font-bold mb-2 neon-text text-cyan-400";
                msg.innerText = "CPU를 압도했습니다!";
            } else {
                title.innerText = "DEFEAT";
                title.className = "text-5xl font-bold mb-2 text-red-500";
                title.style.textShadow = "0 0 20px red";
                msg.innerText = "다음 기회에 도전하세요...";
            }
            document.getElementById('resultScreen').classList.remove('hidden');
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            playerPaddle.y = canvas.height - 50;

            if (gameState === 'MENU') {
                playerPaddle.x = (canvas.width - PADDLE_WIDTH) / 2;
                cpuPaddle.x = (canvas.width - PADDLE_WIDTH) / 2;
            }
        }

        function updateUI() {
            document.getElementById('playerScoreDisplay').innerText = playerScore;
            document.getElementById('cpuScoreDisplay').innerText = cpuScore;
        }

        function gameLoop(timestamp) {
            let dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            if (dt > 0.1) dt = 0.1;

            // 배경 클리어 (잔상 효과)
            ctx.fillStyle = 'rgba(15, 23, 42, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 중앙선
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.setLineDash([20, 20]);
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
            ctx.setLineDash([]);

            playerPaddle.update(dt);
            playerPaddle.draw();

            cpuPaddle.update(dt);
            cpuPaddle.draw();

            if (gameState === 'PLAYING') {
                ball.update(dt);
            }
            ball.draw();
            updateAndDrawParticles(dt);

            animationId = requestAnimationFrame(gameLoop);
        }

        // --- 입력 핸들링 ---
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('mousemove', e => mouseX = e.clientX);
        window.addEventListener('touchmove', e => {
            e.preventDefault();
            mouseX = e.touches[0].clientX;
        }, { passive: false });

        document.getElementById('startBtn').addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            gameState = 'PLAYING';
            document.getElementById('startScreen').classList.add('hidden');
            ball.reset();
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            gameState = 'PLAYING';
            document.getElementById('resultScreen').classList.add('hidden');
            playerScore = 0;
            cpuScore = 0;
            updateUI();
            ball.reset();
        });

        resizeCanvas();
        requestAnimationFrame(gameLoop);

    </script>
</body>

</html>
