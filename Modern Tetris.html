<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Tetris</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            /* Slate 900 */
            font-family: 'Orbitron', sans-serif;
            touch-action: none;
        }

        canvas {
            display: block;
            margin: auto;
            box-shadow: 0 0 50px rgba(168, 85, 247, 0.1);
            /* Purple glow */
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            /* Changed to column to better manage layout */
            justify-content: center;
            align-items: center;
        }

        .interactive {
            pointer-events: auto;
        }

        /* 네온 텍스트 효과 */
        .neon-text {
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #a855f7, 0 0 30px #a855f7, 0 0 40px #a855f7;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }

        .hidden {
            display: none !important;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            user-select: none;
            touch-action: manipulation;
            transition: background 0.1s;
        }

        .control-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Mobile Controls Layout */
        #mobileControls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: none;
            /* JS로 모바일에서만 표시 */
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: auto;
        }
    </style>
</head>

<body>

    <!-- 게임 캔버스 -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI 오버레이 -->
    <div id="uiLayer" class="ui-layer">

        <!-- HUD (Score, Level, Next) -->
        <div
            class="absolute top-4 left-4 right-4 flex justify-between items-start text-white select-none pointer-events-none">
            <div class="glass-panel p-4 flex flex-col gap-2">
                <div class="text-sm text-gray-400">SCORE</div>
                <div id="scoreDisplay" class="text-2xl text-cyan-400">0</div>
                <div class="text-sm text-gray-400 mt-2">LEVEL</div>
                <div id="levelDisplay" class="text-xl text-yellow-400">1</div>
                <div class="text-sm text-gray-400 mt-2">LINES</div>
                <div id="linesDisplay" class="text-xl text-green-400">0</div>
            </div>

            <div class="glass-panel p-4 flex flex-col items-center">
                <div class="text-sm text-gray-400 mb-2">NEXT</div>
                <canvas id="nextCanvas" width="80" height="80"></canvas>
            </div>
        </div>

        <!-- 시작 화면 -->
        <div id="startScreen"
            class="glass-panel p-10 text-center interactive flex flex-col items-center gap-6 animate-pulse z-10">
            <h1 class="text-5xl text-white font-bold neon-text mb-4">NEON TETRIS</h1>
            <p class="text-gray-300 mb-4">화살표 키 또는 버튼으로 조작하세요</p>
            <div class="text-sm text-gray-400 mb-4 grid grid-cols-2 gap-4 text-left">
                <div>↑: 회전</div>
                <div>←/→: 이동</div>
                <div>↓: 소프트 드롭</div>
                <div>SPACE: 하드 드롭</div>
            </div>
            <button id="startBtn"
                class="px-8 py-3 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-full transition-all shadow-[0_0_15px_rgba(147,51,234,0.5)] hover:shadow-[0_0_25px_rgba(147,51,234,0.8)] transform hover:scale-105">
                GAME START
            </button>
        </div>

        <!-- 일시정지 화면 -->
        <div id="pauseScreen"
            class="glass-panel p-10 text-center interactive hidden flex flex-col items-center gap-6 z-10">
            <h1 class="text-5xl text-yellow-400 font-bold mb-2 neon-text">PAUSED</h1>
            <button id="resumeBtn"
                class="px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-full transition-all mt-4">
                RESUME
            </button>
        </div>

        <!-- 게임 오버 화면 -->
        <div id="gameOverScreen"
            class="glass-panel p-10 text-center interactive hidden flex flex-col items-center gap-6 z-10">
            <h1 class="text-5xl text-red-500 font-bold mb-2" style="text-shadow: 0 0 20px red;">GAME OVER</h1>
            <p class="text-white text-2xl">FINAL SCORE: <span id="finalScore">0</span></p>
            <button id="restartBtn"
                class="px-8 py-3 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-full transition-all shadow-[0_0_15px_rgba(219,39,119,0.5)] mt-4">
                TRY AGAIN
            </button>
        </div>

        <!-- 모바일 컨트롤 -->
        <div id="mobileControls">
            <div class="flex flex-col gap-4">
                <div id="btnRotate" class="control-btn bg-purple-500/20">↻</div>
                <div id="btnDown" class="control-btn bg-blue-500/20">↓</div>
            </div>

            <div class="flex gap-4 items-end">
                <div id="btnLeft" class="control-btn bg-gray-500/20">←</div>
                <div id="btnRight" class="control-btn bg-gray-500/20">→</div>
                <div id="btnDrop" class="control-btn bg-red-500/20 text-xs font-bold">DROP</div>
            </div>
        </div>

    </div>

    <script>
        // --- 오디오 시스템 (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'move') {
                // 이동: 짧은 클릭음
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(200, now);
                oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.05);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.05);
                oscillator.start(now);
                oscillator.stop(now + 0.05);
            } else if (type === 'rotate') {
                // 회전: 가벼운 휙 소리
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(400, now);
                oscillator.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.1);
                oscillator.start(now);
                oscillator.stop(now + 0.1);
            } else if (type === 'drop') {
                // 착지: 둔탁한 소리
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(150, now);
                oscillator.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.15);
                oscillator.start(now);
                oscillator.stop(now + 0.15);
            } else if (type === 'clear') {
                // 줄 삭제: 밝은 칭 소리
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(400, now);
                oscillator.frequency.exponentialRampToValueAtTime(800, now + 0.1);

                // 화음 효과
                const osc2 = audioCtx.createOscillator();
                osc2.type = 'triangle';
                osc2.connect(gainNode);
                osc2.frequency.setValueAtTime(600, now);
                osc2.frequency.exponentialRampToValueAtTime(1200, now + 0.2);

                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                oscillator.start(now);
                osc2.start(now);
                oscillator.stop(now + 0.3);
                osc2.stop(now + 0.3);
            } else if (type === 'gameover') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(100, now);
                oscillator.frequency.linearRampToValueAtTime(30, now + 1.0);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 1.0);
                oscillator.start(now);
                oscillator.stop(now + 1.0);
            }
        }

        // --- 게임 상수 및 설정 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');

        const COLS = 10;
        const ROWS = 20;
        let BLOCK_SIZE = 30; // Resize 시 다시 계산됨

        let animationId;
        let lastTime = 0;
        let dropCounter = 0;
        let dropInterval = 1000;

        let gameState = 'MENU'; // MENU, PLAYING, PAUSED, GAMEOVER
        let score = 0;
        let level = 1;
        let lines = 0;
        let board = createMatrix(COLS, ROWS);

        const PIECES = 'ILJOTSZ';
        const COLORS = {
            'I': '#06b6d4', // Cyan
            'L': '#f97316', // Orange
            'J': '#3b82f6', // Blue
            'O': '#eab308', // Yellow
            'Z': '#ef4444', // Red
            'S': '#22c55e', // Green
            'T': '#a855f7'  // Purple
        };

        const SHAPES = {
            'T': [[0, 1, 0], [1, 1, 1], [0, 0, 0]],
            'O': [[2, 2], [2, 2]],
            'L': [[0, 0, 3], [3, 3, 3], [0, 0, 0]],
            'J': [[4, 0, 0], [4, 4, 4], [0, 0, 0]],
            'I': [[0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0]],
            'S': [[0, 6, 6], [6, 6, 0], [0, 0, 0]],
            'Z': [[7, 7, 0], [0, 7, 7], [0, 0, 0]]
        };

        let player = {
            pos: { x: 0, y: 0 },
            matrix: null,
            score: 0,
            type: ''
        };

        let nextPiece = null;

        // --- 기능 함수 ---

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function createPiece(type) {
            if (type === 'I') return SHAPES['I'];
            if (type === 'L') return SHAPES['L'];
            if (type === 'J') return SHAPES['J'];
            if (type === 'O') return SHAPES['O'];
            if (type === 'Z') return SHAPES['Z'];
            if (type === 'S') return SHAPES['S'];
            if (type === 'T') return SHAPES['T'];
        }

        function drawMatrix(matrix, offset, context = ctx, ghost = false) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        const type = PIECES[value - 1];
                        const color = COLORS[type];

                        context.fillStyle = ghost ? `${color}40` : color; // 40 is hex for 25% alpha
                        context.strokeStyle = ghost ? `${color}80` : 'rgba(255,255,255,0.5)';
                        context.lineWidth = 2;

                        const posX = (x + offset.x) * BLOCK_SIZE;
                        const posY = (y + offset.y) * BLOCK_SIZE;

                        // 단순 사각형 대신 약간의 디자인 추가
                        context.shadowBlur = ghost ? 0 : 10;
                        context.shadowColor = color;

                        // 경계 그리기
                        if (!ghost) {
                            context.beginPath();
                            context.rect(posX, posY, BLOCK_SIZE, BLOCK_SIZE);
                            context.fill();
                            context.stroke();
                        } else {
                            // Ghost는 테두리만
                            context.beginPath();
                            context.rect(posX + 2, posY + 2, BLOCK_SIZE - 4, BLOCK_SIZE - 4);
                            context.fillStyle = `${color}20`; // very faint fill
                            context.fill();
                            context.strokeStyle = color;
                            context.stroke();
                        }

                        // 내부 하이라이트 (3D 효과)
                        if (!ghost) {
                            context.shadowBlur = 0;
                            context.fillStyle = 'rgba(255,255,255,0.3)';
                            context.fillRect(posX, posY, BLOCK_SIZE, 4);
                            context.fillRect(posX, posY, 4, BLOCK_SIZE);
                        }
                    }
                });
            });
            context.shadowBlur = 0;
        }

        function drawGhost() {
            const ghostPos = { ...player.pos };
            while (!collide(board, { pos: ghostPos, matrix: player.matrix })) {
                ghostPos.y++;
            }
            ghostPos.y--; // 충돌 직전 위치
            drawMatrix(player.matrix, ghostPos, ctx, true);
        }

        function draw() {
            // 배경 지우기
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 그리드 배경 그리기 (선택)
            drawGrid();

            // 보드 그리기 (안착된 블록)
            drawMatrix(board, { x: 0, y: 0 });

            // 플레이 중일 때만 현재 조각 및 고스트 그리기
            if (gameState === 'PLAYING' || gameState === 'PAUSED') {
                drawGhost();
                drawMatrix(player.matrix, player.pos);
            }

            drawParticles();
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * BLOCK_SIZE, 0);
                ctx.lineTo(i * BLOCK_SIZE, ROWS * BLOCK_SIZE);
                ctx.stroke();
            }
            for (let i = 0; i <= ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * BLOCK_SIZE);
                ctx.lineTo(COLS * BLOCK_SIZE, i * BLOCK_SIZE);
                ctx.stroke();
            }
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                        (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(board, player)) {
                player.pos.y--;
                merge(board, player);
                playSound('drop');
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        function playerHardDrop() {
            while (!collide(board, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(board, player);
            playSound('drop');
            playerReset();
            arenaSweep();
            updateScore();
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(board, player)) {
                player.pos.x -= dir;
            } else {
                playSound('move');
            }
        }

        function playerRotate(dir) {
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            while (collide(board, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = pos;
                    return;
                }
            }
            playSound('rotate');
        }

        function playerReset() {
            if (nextPiece === null) nextPiece = PIECES[PIECES.length * Math.random() | 0];
            const type = nextPiece;
            player.matrix = createPiece(type);
            player.type = type;
            player.pos.y = 0;
            player.pos.x = (board[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

            // Generate new next piece
            nextPiece = PIECES[PIECES.length * Math.random() | 0];
            drawNextPiece();

            if (collide(board, player)) {
                setGameState('GAMEOVER');
                playSound('gameover');
            }
        }

        function drawNextPiece() {
            nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
            if (!nextPiece) return;

            const matrix = createPiece(nextPiece);
            const blockSize = 18; // Smaller block size for preview

            // Center the piece
            const offsetX = (nextCanvas.width - matrix[0].length * blockSize) / 2 / blockSize;
            const offsetY = (nextCanvas.height - matrix.length * blockSize) / 2 / blockSize;

            drawMatrix(matrix, { x: offsetX, y: offsetY }, nextCtx);

            // Override drawMatrix scaling for next canvas usage
            // Since drawMatrix uses global BLOCK_SIZE, we need a custom one or temp modification
            // Let's just create a quick helper for next piece to be safer
        }

        // Override drawMatrix logic for next piece mostly for sizing scaling... 
        // actually easier to just manually draw next piece with custom size loop
        function drawNextPiece() {
            nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
            if (!nextPiece) return;

            const matrix = createPiece(nextPiece);
            const size = 15;
            const type = nextPiece;
            const color = COLORS[type];

            const w = matrix[0].length * size;
            const h = matrix.length * size;
            const ox = (nextCanvas.width - w) / 2;
            const oy = (nextCanvas.height - h) / 2;

            matrix.forEach((row, y) => {
                row.forEach((val, x) => {
                    if (val !== 0) {
                        nextCtx.fillStyle = color;
                        nextCtx.shadowBlur = 5;
                        nextCtx.shadowColor = color;
                        nextCtx.fillRect(ox + x * size, oy + y * size, size - 1, size - 1);
                    }
                });
            });
            nextCtx.shadowBlur = 0;
        }


        function arenaSweep() {
            let rowCount = 0;
            outer: for (let y = board.length - 1; y > 0; --y) {
                for (let x = 0; x < board[y].length; ++x) {
                    if (board[y][x] === 0) {
                        continue outer;
                    }
                }

                // Create explosion particles for the full row
                const rowY = y * BLOCK_SIZE + BLOCK_SIZE / 2;
                createExplosion(canvas.width / 2, rowY, '#fff', 30); // Center explosion or spread it?
                // Better: particles across the row
                for (let k = 0; k < COLS; k++) {
                    createExplosion(k * BLOCK_SIZE + BLOCK_SIZE / 2, rowY, COLORS[PIECES[board[y][k] - 1]], 2);
                }

                const row = board.splice(y, 1)[0].fill(0);
                board.unshift(row);
                ++y;
                rowCount++;
            }
            if (rowCount > 0) {
                score += rowCount * 100 * rowCount; // Bonus for multi-line
                lines += rowCount;
                level = Math.floor(lines / 10) + 1;
                dropInterval = Math.max(100, 1000 - (level - 1) * 100);
                playSound('clear');
            }
        }

        function updateScore() {
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('levelDisplay').innerText = level;
            document.getElementById('linesDisplay').innerText = lines;
            document.getElementById('finalScore').innerText = score;
        }

        // --- 파티클 시스템 ---
        let particles = [];

        function createExplosion(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    dx: (Math.random() - 0.5) * 10,
                    dy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 3 + 1
                });
            }
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.life -= 0.02;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        // --- 시스템 함수 ---

        function resizeCanvas() {
            // Keep the canvas aspect ratio of 10x20 but fit to screen height
            const aspect = COLS / ROWS;
            let h = window.innerHeight - 40; // margin
            let w = h * aspect;

            // Check if width is too wide for mobile
            if (w > window.innerWidth) {
                w = window.innerWidth - 20;
                h = w / aspect;
            }

            canvas.width = w;
            canvas.height = h;

            BLOCK_SIZE = w / COLS;

            // Mobile toggle
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                document.getElementById('mobileControls').style.display = 'flex';
            }
        }

        function update(time = 0) {
            if (gameState !== 'PLAYING') {
                if (gameState === 'GAMEOVER' || gameState === 'PAUSED') draw(); // Keep drawing last state or paused state
                animationId = requestAnimationFrame(update);
                return;
            }

            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;

            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            animationId = requestAnimationFrame(update);
        }

        function setGameState(newState) {
            gameState = newState;

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('pauseScreen').classList.add('hidden');
            document.getElementById('uiLayer').classList.remove('pointer-events-auto');

            if (newState === 'MENU') {
                document.getElementById('startScreen').classList.remove('hidden');
                document.getElementById('uiLayer').classList.add('pointer-events-auto');
                resetGame();
            } else if (newState === 'PLAYING') {
                if (board.every(row => row.every(val => val === 0))) {
                    resetGame();
                    playerReset();
                }
                update();
            } else if (newState === 'PAUSED') {
                document.getElementById('pauseScreen').classList.remove('hidden');
                document.getElementById('uiLayer').classList.add('pointer-events-auto');
            } else if (newState === 'GAMEOVER') {
                document.getElementById('gameOverScreen').classList.remove('hidden');
                document.getElementById('uiLayer').classList.add('pointer-events-auto');
            }
        }

        function resetGame() {
            board = createMatrix(COLS, ROWS);
            score = 0;
            lines = 0;
            level = 1;
            lastTime = 0;
            dropCounter = 0;
            updateScore();
        }

        // --- 입력 핸들링 ---

        document.addEventListener('keydown', event => {
            if (gameState !== 'PLAYING') return;

            if (event.keyCode === 37) { // Left
                playerMove(-1);
            } else if (event.keyCode === 39) { // Right
                playerMove(1);
            } else if (event.keyCode === 40) { // Down
                playerDrop();
            } else if (event.keyCode === 38) { // Up (Rotate)
                playerRotate(1);
            } else if (event.keyCode === 32) { // Space (Hard Drop)
                playerHardDrop();
            } else if (event.keyCode === 27) { // ESC (Pause)
                setGameState('PAUSED');
            }
        });

        window.addEventListener('resize', resizeCanvas);

        // UI Buttons
        document.getElementById('startBtn').addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            setGameState('PLAYING');
            playerReset();
            update();
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            setGameState('MENU');
            setTimeout(() => {
                setGameState('PLAYING');
                playerReset();
            }, 100);
        });

        document.getElementById('resumeBtn').addEventListener('click', () => {
            setGameState('PLAYING');
        });

        // Mobile Button Events
        function addTouchAction(id, action) {
            const btn = document.getElementById(id);
            // Prevent default context menu
            btn.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); return false; });

            // Touch start handles immediate action
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (gameState === 'PLAYING') action();
            }, { passive: false });

            // Click for testing on desktop
            btn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                if (gameState === 'PLAYING') action();
            });
        }

        addTouchAction('btnLeft', () => playerMove(-1));
        addTouchAction('btnRight', () => playerMove(1));
        addTouchAction('btnRotate', () => playerRotate(1));
        addTouchAction('btnDown', () => playerDrop());
        addTouchAction('btnDrop', () => playerHardDrop());

        // Init
        resizeCanvas();
        resetGame();
        draw(); // Initial draw

    </script>
</body>

</html>
