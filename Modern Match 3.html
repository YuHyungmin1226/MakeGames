<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Match 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            /* Slate 900 */
            font-family: 'Orbitron', sans-serif;
            touch-action: none;
        }

        canvas {
            display: block;
            margin: auto;
            box-shadow: 0 0 50px rgba(236, 72, 153, 0.1);
            /* Pink glow */
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .interactive {
            pointer-events: auto;
        }

        /* 네온 텍스트 효과 */
        .neon-text {
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #ec4899, 0 0 30px #ec4899, 0 0 40px #ec4899;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- 게임 캔버스 -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI 오버레이 -->
    <div id="uiLayer" class="ui-layer">

        <!-- HUD -->
        <div class="absolute top-4 left-4 right-4 flex justify-between items-start text-white select-none">
            <div class="glass-panel p-4 flex flex-col gap-1 w-32">
                <div class="text-sm text-gray-400">SCORE</div>
                <div id="scoreDisplay" class="text-2xl text-cyan-400">0</div>
            </div>

            <div class="glass-panel p-4 flex flex-col items-end gap-1 w-32">
                <div class="text-sm text-gray-400">TIME</div>
                <div id="timeDisplay" class="text-2xl text-yellow-400">60</div>
            </div>
        </div>

        <!-- 시작 화면 -->
        <div id="startScreen"
            class="glass-panel p-10 text-center interactive flex flex-col items-center gap-6 animate-pulse z-10">
            <h1 class="text-5xl text-white font-bold neon-text mb-4">NEON MATCH</h1>
            <p class="text-gray-300 mb-4">3개 이상의 모양을 연결하세요</p>
            <p class="text-sm text-pink-400 mb-2">60초 타임 어택!</p>
            <button id="startBtn"
                class="px-8 py-3 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-full transition-all shadow-[0_0_15px_rgba(236,72,153,0.5)] hover:shadow-[0_0_25px_rgba(236,72,153,0.8)] transform hover:scale-105">
                GAME START
            </button>
        </div>

        <!-- 게임 오버 화면 -->
        <div id="gameOverScreen"
            class="glass-panel p-10 text-center interactive hidden flex flex-col items-center gap-6 z-10">
            <h1 class="text-5xl text-red-500 font-bold mb-2" style="text-shadow: 0 0 20px red;">TIME UP</h1>
            <p class="text-white text-2xl">FINAL SCORE: <span id="finalScore">0</span></p>
            <button id="restartBtn"
                class="px-8 py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-full transition-all shadow-[0_0_15px_rgba(8,145,178,0.5)] mt-4">
                TRY AGAIN
            </button>
        </div>

        <!-- 메시지 플로팅 (Combo 등) -->
        <div id="messageOverlay"
            class="absolute pointer-events-none text-4xl font-bold text-white transition-opacity duration-500 opacity-0"
            style="text-shadow: 0 0 10px white;">
            COMBO!
        </div>
    </div>

    <script>
        // --- 오디오 시스템 (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type, pitchMultiplier = 1.0) {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'select') {
                // 선택: 틱
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(400, now);
                oscillator.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.1);
                oscillator.start(now);
                oscillator.stop(now + 0.1);
            } else if (type === 'swap') {
                // 스왑: 휙
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(300, now);
                oscillator.frequency.linearRampToValueAtTime(100, now + 0.2);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.2);
                oscillator.start(now);
                oscillator.stop(now + 0.2);
            } else if (type === 'match') {
                // 매치: 칭! (콤보에 따라 피치 상승)
                oscillator.type = 'sine';
                const baseFreq = 400 * pitchMultiplier;
                oscillator.frequency.setValueAtTime(baseFreq, now);
                oscillator.frequency.exponentialRampToValueAtTime(baseFreq * 2, now + 0.2);

                // 화음 추가
                const osc2 = audioCtx.createOscillator();
                osc2.type = 'triangle';
                osc2.connect(gainNode);
                osc2.frequency.setValueAtTime(baseFreq * 1.5, now); // 5도 위
                osc2.frequency.exponentialRampToValueAtTime(baseFreq * 3, now + 0.3);
                osc2.start(now);
                osc2.stop(now + 0.3);

                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                oscillator.start(now);
                oscillator.stop(now + 0.3);
            } else if (type === 'invalid') {
                // 실패: 웅
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, now);
                oscillator.frequency.linearRampToValueAtTime(100, now + 0.2);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.2);
                oscillator.start(now);
                oscillator.stop(now + 0.2);
            } else if (type === 'gameover') {
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(300, now);
                oscillator.frequency.exponentialRampToValueAtTime(50, now + 1.0);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 1.0);
                oscillator.start(now);
                oscillator.stop(now + 1.0);
            }
        }

        // --- 게임 상수 및 설정 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const COLS = 8;
        const ROWS = 8;
        let TILE_SIZE = 60; // Resize 시 재계산
        const MARGIN_TOP = 20;

        // 모양 정의 (0:빈공간, 1~6:타입)
        const SHAPES = [
            { id: 1, color: '#06b6d4', type: 'circle' },   // Cyan
            { id: 2, color: '#f97316', type: 'square' },   // Orange
            { id: 3, color: '#ef4444', type: 'heart' },    // Red
            { id: 4, color: '#eab308', type: 'triangle' }, // Yellow
            { id: 5, color: '#a855f7', type: 'diamond' },  // Purple
            { id: 6, color: '#22c55e', type: 'hexagon' }   // Green
        ];

        let board = [];
        // board[y][x] = { type: 1, x: screenX, y: screenY, alpha: 1, state: 'IDLE'|'MOVING'|'MATCHED' }
        // 화면 좌표(screenX, Y)는 애니메이션 용

        let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
        let score = 0;
        let timeLeft = 60;
        let selectedTile = null; // {c, r}
        let isProcessing = false; // 애니메이션 중 입력 차단
        let comboMultiplier = 1;

        let mouseX = 0;
        let mouseY = 0;

        let animationId;
        let lastTime = 0;

        // --- 보드 초기화 및 로직 ---

        function initBoard() {
            board = [];
            for (let r = 0; r < ROWS; r++) {
                let row = [];
                for (let c = 0; c < COLS; c++) {
                    row.push(createRandomTile(c, r));
                }
                board.push(row);
            }
            // 초기 매치 제거 (화면 안 보여주고 데이터만 정리)
            resolveInitialMatches();
            centerBoard();
        }

        function createRandomTile(c, r) {
            const typeIdx = Math.floor(Math.random() * SHAPES.length);
            return {
                type: SHAPES[typeIdx].id,
                c: c,
                r: r,
                x: 0, // 나중에 계산
                y: 0,
                targetX: 0,
                targetY: 0,
                state: 'IDLE',
                alpha: 1,
                scale: 1,
                offsetY: 0 // 드롭 애니메이션용
            };
        }

        function resolveInitialMatches() {
            // 처음 켰을 때 매치된 게 없도록
            let hasMatch = true;
            while (hasMatch) {
                hasMatch = false;
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (checkMatchAt(c, r)) {
                            // 타입 변경
                            let newType = (board[r][c].type % SHAPES.length) + 1;
                            board[r][c].type = newType;
                            hasMatch = true;
                        }
                    }
                }
            }
        }

        function checkMatchAt(c, r) {
            // Horizontal
            if (c >= 2) {
                if (board[r][c].type === board[r][c - 1].type && board[r][c].type === board[r][c - 2].type) return true;
            }
            // Vertical
            if (r >= 2) {
                if (board[r][c].type === board[r - 1][c].type && board[r][c].type === board[r - 2][c].type) return true;
            }
            return false;
        }

        function findMatches() {
            let matches = [];

            // Horizontal
            for (let r = 0; r < ROWS; r++) {
                let matchLen = 1;
                for (let c = 1; c < COLS; c++) {
                    if (board[r][c].type === board[r][c - 1].type && board[r][c].type !== 0) {
                        matchLen++;
                    } else {
                        if (matchLen >= 3) {
                            for (let k = 0; k < matchLen; k++) matches.push({ c: c - 1 - k, r: r });
                        }
                        matchLen = 1;
                    }
                }
                if (matchLen >= 3) {
                    for (let k = 0; k < matchLen; k++) matches.push({ c: COLS - 1 - k, r: r });
                }
            }

            // Vertical
            for (let c = 0; c < COLS; c++) {
                let matchLen = 1;
                for (let r = 1; r < ROWS; r++) {
                    if (board[r][c].type === board[r - 1][c].type && board[r][c].type !== 0) {
                        matchLen++;
                    } else {
                        if (matchLen >= 3) {
                            for (let k = 0; k < matchLen; k++) matches.push({ c: c, r: r - 1 - k });
                        }
                        matchLen = 1;
                    }
                }
                if (matchLen >= 3) {
                    for (let k = 0; k < matchLen; k++) matches.push({ c: c, r: ROWS - 1 - k });
                }
            }

            // 중복 제거
            const uniqueMatches = [];
            const visited = new Set();
            matches.forEach(m => {
                const key = `${m.c},${m.r}`;
                if (!visited.has(key)) {
                    visited.add(key);
                    uniqueMatches.push(m);
                }
            });

            return uniqueMatches;
        }

        // --- 게임 액션 ---

        function handleInput(c, r) {
            if (gameState !== 'PLAYING' || isProcessing) return;
            if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;

            playSound('select');

            if (!selectedTile) {
                selectedTile = { c, r };
            } else {
                // 같은 거 클릭 -> 취소
                if (selectedTile.c === c && selectedTile.r === r) {
                    selectedTile = null;
                    return;
                }

                // 인접한지 확인
                const dist = Math.abs(selectedTile.c - c) + Math.abs(selectedTile.r - r);
                if (dist === 1) {
                    // Swap 시도
                    swapTiles(selectedTile, { c, r });
                    selectedTile = null;
                } else {
                    // 멀리 있는 거 클릭하면 선택 변경
                    selectedTile = { c, r };
                }
            }
        }

        function swapTiles(t1, t2) {
            isProcessing = true;

            // 데이터 스왑
            let temp = board[t1.r][t1.c].type;
            board[t1.r][t1.c].type = board[t2.r][t2.c].type;
            board[t2.r][t2.c].type = temp;

            // 잠시 기다렸다가 매치 확인
            playSound('swap');
            setTimeout(() => {
                const matches = findMatches();
                if (matches.length > 0) {
                    // 매치 성공
                    processMatches(matches);
                } else {
                    // 매치 실패 -> 원복
                    let tempRevert = board[t1.r][t1.c].type;
                    board[t1.r][t1.c].type = board[t2.r][t2.c].type;
                    board[t2.r][t2.c].type = tempRevert;
                    playSound('invalid');
                    isProcessing = false;
                }
            }, 300); // 300ms visual swap duration
        }

        function processMatches(matches) {
            // 점수 계산
            const points = matches.length * 10 * comboMultiplier;
            score += points;
            score += (matches.length - 3) * 20; // 추가 보너스

            playSound('match', comboMultiplier > 5 ? 2.0 : 1.0 + (comboMultiplier * 0.1));

            showFloatingText(`+${points}`, board[matches[0].r][matches[0].c].x, board[matches[0].r][matches[0].c].y);

            // 매치된 타일 제거 효과
            matches.forEach(m => {
                const tile = board[m.r][m.c];
                tile.scale = 0; // 축소 효과
                createExplosion(tile.x, tile.y, getShapeColor(tile.type), 5);
                tile.type = 0; // 빈 공간 처리
            });

            updateUI();

            // 0.3초 후 드롭 처리
            setTimeout(() => {
                applyGravity();
            }, 300);
        }

        function applyGravity() {
            // 아래서부터 채우기
            for (let c = 0; c < COLS; c++) {
                let writeRow = ROWS - 1;
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (board[r][c].type !== 0) {
                        if (writeRow !== r) {
                            board[writeRow][c].type = board[r][c].type;
                            board[writeRow][c].offsetY = (writeRow - r) * TILE_SIZE; // 위에서 떨어진 거리만큼 오프셋
                            board[r][c].type = 0;
                        }
                        writeRow--;
                    }
                }
                // 빈 공간 채우기 (새 타일 생성)
                for (let r = writeRow; r >= 0; r--) {
                    board[r][c] = createRandomTile(c, r);
                    board[r][c].offsetY = (writeRow + 2) * TILE_SIZE; // 화면 밖에서
                }
            }

            // 애니메이션 대기 후 다시 매치 확인
            setTimeout(() => {
                // 오프셋 초기화는 update loop에서 lerp로 처리

                // 연쇄 작용 확인
                const matches = findMatches();
                if (matches.length > 0) {
                    comboMultiplier++;
                    processMatches(matches);
                } else {
                    comboMultiplier = 1;
                    isProcessing = false;
                }
            }, 500);
        }


        // --- 그리기 함수 ---

        function draw() {
            // 배경
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 보드 배경 (그리드)
            centerBoard();

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const tile = board[r][c];

                    // 위치 보간 (부드러운 움직임)
                    const targetX = startX + c * TILE_SIZE + TILE_SIZE / 2;
                    let targetY = startY + r * TILE_SIZE + TILE_SIZE / 2;

                    // Drop animation offset
                    if (tile.offsetY > 0) {
                        targetY -= tile.offsetY;
                        tile.offsetY *= 0.8; // 감쇠
                        if (tile.offsetY < 1) tile.offsetY = 0;
                    }

                    tile.x += (targetX - tile.x) * 0.2;
                    tile.y += (targetY - tile.y) * 0.2;

                    // Scale 복구
                    if (tile.scale < 1) tile.scale += (1 - tile.scale) * 0.1;
                    if (tile.type === 0) continue;

                    // 선택된 타일 하이라이트
                    const isSelected = selectedTile && selectedTile.c === c && selectedTile.r === r;

                    drawShape(tile, isSelected);
                }
            }

            // 파티클
            drawParticles();
        }

        function drawShape(tile, isSelected) {
            // const ctx = window.ctx; // Removed erroneous line

            const size = (TILE_SIZE / 2 - 4) * tile.scale;
            const shapeInfo = SHAPES.find(s => s.id === tile.type);
            if (!shapeInfo) return;

            const color = shapeInfo.color;

            ctx.save();
            ctx.translate(tile.x, tile.y);

            // 선택 효과: 회전하는 글로우
            if (isSelected) {
                const time = Date.now() / 200;
                ctx.rotate(Math.sin(time) * 0.1);
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#fff';
            } else {
                ctx.shadowBlur = 10;
                ctx.shadowColor = color;
            }

            ctx.fillStyle = color;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;

            ctx.beginPath();
            if (shapeInfo.type === 'circle') {
                ctx.arc(0, 0, size, 0, Math.PI * 2);
            } else if (shapeInfo.type === 'square') {
                ctx.rect(-size, -size, size * 2, size * 2);
            } else if (shapeInfo.type === 'triangle') {
                ctx.moveTo(0, -size);
                ctx.lineTo(size, size);
                ctx.lineTo(-size, size);
                ctx.closePath();
            } else if (shapeInfo.type === 'diamond') {
                ctx.moveTo(0, -size * 1.2);
                ctx.lineTo(size, 0);
                ctx.lineTo(0, size * 1.2);
                ctx.lineTo(-size, 0);
                ctx.closePath();
            } else if (shapeInfo.type === 'hexagon') {
                for (let i = 0; i < 6; i++) {
                    ctx.lineTo(size * Math.cos(i * Math.PI / 3), size * Math.sin(i * Math.PI / 3));
                }
                ctx.closePath();
            } else if (shapeInfo.type === 'heart') {
                // Simple Heart
                const topCurveHeight = size * 0.3;
                ctx.moveTo(0, size * 0.3);
                ctx.bezierCurveTo(0, -size * 0.5, -size, -size * 0.5, -size, 0);
                ctx.bezierCurveTo(-size, size * 0.5, 0, size * 0.8, 0, size);
                ctx.bezierCurveTo(0, size * 0.8, size, size * 0.5, size, 0);
                ctx.bezierCurveTo(size, -size * 0.5, 0, -size * 0.5, 0, size * 0.3);
            }

            ctx.globalAlpha = 0.8;
            ctx.fill();
            ctx.globalAlpha = 1.0;
            ctx.stroke();

            // 내부 광택
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fill();

            ctx.restore();
        }

        function getShapeColor(typeId) {
            const s = SHAPES.find(x => x.id === typeId);
            return s ? s.color : '#fff';
        }

        // --- 파티클 시스템 ---
        let particles = [];
        function createExplosion(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    dx: (Math.random() - 0.5) * 10,
                    dy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.life -= 0.05;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        // --- 플로팅 텍스트 ---
        function showFloatingText(text, x, y) {
            const el = document.getElementById('messageOverlay');
            el.innerText = text;
            el.style.left = canvas.offsetLeft + x + 'px'; // Canvas relative
            el.style.top = canvas.offsetTop + y + 'px';
            el.style.transform = 'translate(-50%, -50%) scale(1.5)';
            el.style.opacity = '1';

            // 위치 보정 (단순화를 위해 CSS transition 사용)
            // 약간 위로 올라가는 효과는 CSS animation으로 하거나 여기서 JS로 해야함.
            // 복잡도 줄이기 위해 고정 위치 페이드인아웃만 사용
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translate(-50%, -100%) scale(1)';
            }, 500);
        }

        // --- 시스템 함수 ---
        let startX = 0;
        let startY = 0;

        function centerBoard() {
            // 반응형 센터링
            TILE_SIZE = Math.min(canvas.width / COLS, (canvas.height - 100) / ROWS);
            // 모바일에서는 더 작게
            if (TILE_SIZE > 60) TILE_SIZE = 60;

            const boardWidth = TILE_SIZE * COLS;
            const boardHeight = TILE_SIZE * ROWS;

            startX = (canvas.width - boardWidth) / 2;
            startY = (canvas.height - boardHeight) / 2 + 20;
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            centerBoard();
        }

        function gameLoop(time) {
            const dt = (time - lastTime) / 1000;
            lastTime = time;

            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function timerLoop() {
            if (gameState !== 'PLAYING') return;

            timeLeft--;
            document.getElementById('timeDisplay').innerText = timeLeft;

            if (timeLeft <= 10) {
                document.getElementById('timeDisplay').classList.add('text-red-500');
                document.getElementById('timeDisplay').classList.add('animate-pulse');
                playSound('select', 2.0); // 틱톡 소리 대용
            }

            if (timeLeft <= 0) {
                setGameState('GAMEOVER');
                playSound('gameover');
            } else {
                setTimeout(timerLoop, 1000);
            }
        }

        function setGameState(newState) {
            gameState = newState;
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('uiLayer').classList.remove('pointer-events-auto'); // Default none

            if (newState === 'MENU') {
                document.getElementById('startScreen').classList.remove('hidden');
                document.getElementById('uiLayer').classList.add('pointer-events-auto');
                score = 0;
                timeLeft = 60;
                updateUI();
                initBoard();
            } else if (newState === 'PLAYING') {
                score = 0;
                timeLeft = 60;
                document.getElementById('timeDisplay').classList.remove('text-red-500');
                document.getElementById('timeDisplay').classList.remove('animate-pulse');
                updateUI();
                initBoard();
                timerLoop();
                document.getElementById('uiLayer').classList.add('pointer-events-auto'); // For canvas clicks underneath? No, canvas has its own listeners.
                // UI layer blocks canvas if interactive is set on full layer.
                // Actually canvas needs to be clickable. UI Layer is pointer-events: none except buttons.
                document.getElementById('uiLayer').classList.remove('pointer-events-auto');
            } else if (newState === 'GAMEOVER') {
                document.getElementById('gameOverScreen').classList.remove('hidden');
                document.getElementById('uiLayer').classList.add('pointer-events-auto'); // buttons clickable
            }
        }

        function updateUI() {
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('timeDisplay').innerText = timeLeft;
            document.getElementById('finalScore').innerText = score;
        }

        // --- 입력 ---

        window.addEventListener('resize', resizeCanvas);

        canvas.addEventListener('mousedown', e => {
            const r = Math.floor((e.clientY - startY) / TILE_SIZE);
            const c = Math.floor((e.clientX - startX) / TILE_SIZE);
            handleInput(c, r);
        });

        canvas.addEventListener('touchstart', e => {
            const r = Math.floor((e.touches[0].clientY - startY) / TILE_SIZE);
            const c = Math.floor((e.touches[0].clientX - startX) / TILE_SIZE);
            handleInput(c, r);
        });

        document.getElementById('startBtn').addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            setGameState('PLAYING');
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            setGameState('MENU');
            setTimeout(() => setGameState('PLAYING'), 100);
        });

        // Init
        resizeCanvas();
        initBoard();
        requestAnimationFrame(gameLoop);

    </script>
</body>

</html>
